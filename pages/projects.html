<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Projects — Shreyansh Jaiswal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* ── SHARED VARS ── */
    :root {
      --bg-primary:#020408;--bg-secondary:#060c14;--bg-card:rgba(6,15,30,.7);
      --bg-glass:rgba(10,20,40,.6);--neon-blue:#00d4ff;--neon-purple:#a855f7;
      --neon-pink:#f72585;--neon-cyan:#06ffd4;--neon-green:#39ff14;
      --text-primary:#e8f4ff;--text-secondary:#7a9bb5;--text-muted:#3d5a73;
      --border-glass:rgba(0,212,255,.12);--border-glow:rgba(0,212,255,.4);
      --gradient-main:linear-gradient(135deg,#00d4ff 0%,#a855f7 50%,#f72585 100%);
      --gradient-blue-purple:linear-gradient(135deg,#00d4ff,#a855f7);
      --font-display:'Syne',sans-serif;--font-body:'Space Grotesk',sans-serif;
      --font-mono:'Space Mono',monospace;--radius-sm:8px;--radius-md:16px;
      --radius-lg:24px;--transition:all .3s cubic-bezier(.4,0,.2,1);
      --shadow-neon-blue:0 0 20px rgba(0,212,255,.3),0 0 60px rgba(0,212,255,.1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);line-height:1.6;overflow-x:hidden;cursor:none}
    ::selection{background:rgba(0,212,255,.3);color:var(--neon-blue)}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:var(--bg-primary)}
    ::-webkit-scrollbar-thumb{background:linear-gradient(var(--neon-blue),var(--neon-purple));border-radius:2px}
    a{text-decoration:none;color:inherit}
    button{cursor:pointer;border:none;background:none;font-family:inherit}
    img{max-width:100%;display:block}

    /* CURSOR */
    #cursor{width:12px;height:12px;background:var(--neon-blue);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 10px var(--neon-blue),0 0 20px rgba(0,212,255,.5)}
    #cursor-trail{width:32px;height:32px;border:1px solid rgba(0,212,255,.4);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .15s ease-out}

    /* NAVBAR */
    #navbar{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 24px;height:72px;display:flex;align-items:center;background:rgba(2,4,8,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-glass)}
    .nav-container{max-width:1280px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    .nav-logo{font-family:var(--font-display);font-size:1.5rem;font-weight:800;color:var(--text-primary);letter-spacing:.05em}
    .logo-bracket{color:var(--neon-blue);text-shadow:0 0 10px var(--neon-blue)}
    .nav-back{display:flex;align-items:center;gap:8px;padding:10px 20px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:.75rem;color:var(--neon-blue);letter-spacing:.05em;transition:var(--transition)}
    .nav-back:hover{background:rgba(0,212,255,.15);box-shadow:0 0 15px rgba(0,212,255,.2)}

    /* PAGE HEADER */
    .page-header{padding:140px 24px 60px;text-align:center;position:relative;overflow:hidden}
    .page-header::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,black 40%,transparent 80%)}
    .page-tag{font-family:var(--font-mono);font-size:.75rem;color:var(--neon-blue);letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:12px}
    .page-title{font-family:var(--font-display);font-size:clamp(2.5rem,6vw,4.5rem);font-weight:800;line-height:1.1;margin-bottom:16px}
    .gradient-text{background:var(--gradient-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .page-desc{color:var(--text-secondary);font-size:1rem;max-width:500px;margin:0 auto}

    /* CONTAINER */
    .container{max-width:1280px;margin:0 auto;padding:0 24px}

    /* CONTROLS */
    .controls-bar{padding:0 24px 40px;max-width:1280px;margin:0 auto}
    .controls-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:20px 24px;background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid var(--border-glass);border-radius:var(--radius-md)}
    .search-wrap{position:relative;flex:1;max-width:360px}
    .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
    .search-input{width:100%;padding:12px 16px 12px 42px;background:rgba(255,255,255,.03);border:1px solid var(--border-glass);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-body);font-size:.85rem;outline:none;transition:var(--transition)}
    .search-input::placeholder{color:var(--text-muted)}
    .search-input:focus{border-color:rgba(0,212,255,.4);box-shadow:0 0 0 3px rgba(0,212,255,.08)}
    .filter-tabs{display:flex;gap:8px;flex-wrap:wrap}
    .filter-btn{padding:10px 20px;background:rgba(255,255,255,.03);border:1px solid var(--border-glass);border-radius:100px;font-family:var(--font-mono);font-size:.72rem;color:var(--text-secondary);letter-spacing:.05em;transition:var(--transition)}
    .filter-btn:hover,.filter-btn.active{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.4);color:var(--neon-blue);box-shadow:0 0 12px rgba(0,212,255,.15)}
    .sort-select{padding:10px 16px;background:rgba(255,255,255,.03);border:1px solid var(--border-glass);border-radius:var(--radius-sm);color:var(--text-secondary);font-family:var(--font-mono);font-size:.72rem;outline:none;cursor:pointer;transition:var(--transition)}
    .sort-select:focus{border-color:rgba(0,212,255,.4)}
    .sort-select option{background:var(--bg-secondary)}

    /* RESULTS INFO */
    .results-info{padding:0 24px 20px;max-width:1280px;margin:0 auto;font-family:var(--font-mono);font-size:.72rem;color:var(--text-muted);letter-spacing:.05em}
    .results-info span{color:var(--neon-blue)}

    /* PROJECTS GRID */
    .projects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:0 24px 60px;max-width:1280px;margin:0 auto}
    .project-card{background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid var(--border-glass);border-radius:var(--radius-md);overflow:hidden;transition:var(--transition);cursor:pointer;opacity:0;transform:translateY(20px)}
    .project-card.visible{opacity:1;transform:translateY(0)}
    .project-card:hover{border-color:rgba(0,212,255,.3);transform:translateY(-6px);box-shadow:var(--shadow-neon-blue)}
    .project-card.featured{border-color:rgba(168,85,247,.3)}
    .project-card.featured:hover{border-color:var(--neon-purple);box-shadow:0 0 20px rgba(168,85,247,.3),0 0 60px rgba(168,85,247,.1)}
    .project-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg-secondary)}
    .project-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
    .project-card:hover .project-thumb img{transform:scale(1.08)}
    .project-thumb-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(2,4,8,.9) 100%)}
    .project-featured-badge{position:absolute;top:12px;right:12px;padding:4px 12px;background:rgba(168,85,247,.9);border-radius:100px;font-family:var(--font-mono);font-size:.6rem;color:#fff;letter-spacing:.1em;text-transform:uppercase}
    .project-body{padding:20px}
    .project-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .project-tag{padding:3px 10px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.15);border-radius:100px;font-family:var(--font-mono);font-size:.62rem;color:var(--neon-blue)}
    .project-title{font-family:var(--font-display);font-size:1.05rem;font-weight:700;color:var(--text-primary);margin-bottom:8px;line-height:1.3}
    .project-desc{font-size:.82rem;color:var(--text-secondary);line-height:1.6;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .project-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border-glass)}
    .project-date{font-family:var(--font-mono);font-size:.65rem;color:var(--text-muted)}
    .project-links{display:flex;gap:8px}
    .project-link{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:.65rem;font-weight:600;letter-spacing:.05em;transition:var(--transition)}
    .project-link.github{background:rgba(255,255,255,.05);color:var(--text-secondary);border:1px solid rgba(255,255,255,.08)}
    .project-link.github:hover{color:var(--text-primary);border-color:rgba(255,255,255,.2)}
    .project-link.demo{background:rgba(0,212,255,.1);color:var(--neon-blue);border:1px solid rgba(0,212,255,.2)}
    .project-link.demo:hover{background:rgba(0,212,255,.2);box-shadow:0 0 12px rgba(0,212,255,.2)}

    /* PAGINATION */
    .pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 24px 80px}
    .page-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:.8rem;color:var(--text-secondary);transition:var(--transition)}
    .page-btn:hover,.page-btn.active{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.4);color:var(--neon-blue)}
    .page-btn:disabled{opacity:.3;cursor:not-allowed}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:var(--transition)}
    .modal-overlay.active{opacity:1;visibility:visible}
    .modal-box{background:var(--bg-secondary);border:1px solid var(--border-glass);border-radius:var(--radius-lg);max-width:700px;width:100%;max-height:85vh;overflow-y:auto;position:relative;transform:scale(.9) translateY(20px);transition:var(--transition)}
    .modal-overlay.active .modal-box{transform:scale(1) translateY(0)}
    .modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid var(--border-glass);border-radius:var(--radius-sm);color:var(--text-secondary);transition:var(--transition);z-index:1}
    .modal-close:hover{color:var(--neon-pink);border-color:rgba(247,37,133,.3)}
    #modalContent{padding:32px}

    /* EMPTY STATE */
    .empty-state{grid-column:1/-1;text-align:center;padding:80px 20px}
    .empty-icon{font-size:3rem;margin-bottom:16px}
    .empty-title{font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--text-primary);margin-bottom:8px}
    .empty-text{font-family:var(--font-mono);font-size:.8rem;color:var(--text-muted)}

    /* FOOTER */
    .footer-mini{padding:24px;text-align:center;border-top:1px solid var(--border-glass);font-family:var(--font-mono);font-size:.7rem;color:var(--text-muted)}
    .footer-mini span{background:var(--gradient-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

    /* RESPONSIVE */
    @media(max-width:1024px){.projects-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:768px){
      .projects-grid{grid-template-columns:1fr}
      .controls-inner{flex-direction:column;align-items:stretch}
      .search-wrap{max-width:100%}
      .filter-tabs{overflow-x:auto;padding-bottom:4px}
      .filter-btn{flex-shrink:0}
      #cursor,#cursor-trail{display:none}
      body{cursor:auto}
    }

    /* TOAST */
    .toast{position:fixed;bottom:32px;right:32px;padding:14px 24px;background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid rgba(57,255,20,.3);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:.8rem;color:var(--neon-green);z-index:3000;transform:translateY(100px);opacity:0;transition:var(--transition)}
    .toast.show{transform:translateY(0);opacity:1}

    /* BTN */
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:var(--transition);white-space:nowrap}
    .btn-primary{background:var(--gradient-blue-purple);color:#fff;box-shadow:0 0 20px rgba(0,212,255,.3)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(0,212,255,.5)}
    .btn-secondary{background:rgba(168,85,247,.1);color:var(--neon-purple);border:1px solid rgba(168,85,247,.3)}
    .btn-secondary:hover{background:rgba(168,85,247,.2);border-color:var(--neon-purple);box-shadow:0 0 20px rgba(168,85,247,.3);transform:translateY(-2px)}
    .gradient-blue-purple{background:var(--gradient-blue-purple)}
  </style>
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-trail"></div>

  <nav id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <span class="logo-bracket">[</span>SJ<span class="logo-bracket">]</span>
      </a>
      <a href="../index.html" class="nav-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Portfolio
      </a>
    </div>
  </nav>

  <div class="page-header">
    <span class="page-tag">// ALL PROJECTS</span>
    <h1 class="page-title">Complete <span class="gradient-text">Project Archive</span></h1>
    <p class="page-desc">Every project I've built — from experiments to production apps.</p>
  </div>

  <div class="controls-bar">
    <div class="controls-inner">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search projects..." class="search-input" />
      </div>
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="web">Web Dev</button>
        <button class="filter-btn" data-filter="video">Video</button>
        <button class="filter-btn" data-filter="ai">AI/ML</button>
        <button class="filter-btn" data-filter="design">Design</button>
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="featured">Featured First</option>
        <option value="az">A → Z</option>
      </select>
    </div>
  </div>

  <div class="results-info" id="resultsInfo">Showing <span id="resultsCount">0</span> projects</div>

  <div class="projects-grid" id="projectsGrid"></div>

  <div class="pagination" id="pagination"></div>

  <!-- Modal -->
  <div id="projectModal" class="modal-overlay">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <footer class="footer-mini">
    © 2024 Shreyansh Jaiswal · Powered by <span>Ethics Learn</span>
  </footer>

  <script>
    // ── DATA ──
    const DEFAULT_PROJECTS = [
      {id:1,title:"Ethics Learn Platform",desc:"A full-featured educational platform with video courses, quizzes, and progress tracking built with React and Firebase.",category:"web",tags:["React","Firebase","Tailwind"],image:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&q=80",github:"https://github.com",demo:"https://ethicslearn.com",date:"Dec 2024",featured:true},
      {id:2,title:"Cyberpunk Portfolio UI",desc:"Award-winning portfolio design with particle animations, glassmorphism cards, and cinematic cyberpunk aesthetics.",category:"design",tags:["HTML","CSS","JavaScript"],image:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&q=80",github:"https://github.com",demo:"#",date:"Nov 2024",featured:true},
      {id:3,title:"AI Content Generator",desc:"Python-powered AI tool that generates blog posts, social media captions, and marketing copy using OpenAI API.",category:"ai",tags:["Python","OpenAI","FastAPI"],image:"https://images.unsplash.com/photo-1677442135703-1787eea5ce01?w=600&q=80",github:"https://github.com",demo:"#",date:"Oct 2024",featured:false},
      {id:4,title:"YouTube Channel Branding",desc:"Complete brand identity and video editing package for Ethics Learn YouTube channel — thumbnails, intros, and motion graphics.",category:"video",tags:["Premiere Pro","After Effects","Photoshop"],image:"https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=600&q=80",github:"#",demo:"https://youtube.com/@EthicsLearn",date:"Sep 2024",featured:false},
      {id:5,title:"React Dashboard UI",desc:"Modern analytics dashboard with real-time charts, dark mode, and responsive layout built with React and Recharts.",category:"web",tags:["React","Recharts","Tailwind"],image:"https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600&q=80",github:"https://github.com",demo:"#",date:"Aug 2024",featured:false},
      {id:6,title:"Python Web Scraper",desc:"Automated web scraping tool with data extraction, CSV export, and scheduled runs using Python, BeautifulSoup, and Selenium.",category:"ai",tags:["Python","Selenium","BeautifulSoup"],image:"https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&q=80",github:"https://github.com",demo:"#",date:"Jul 2024",featured:false},
      {id:7,title:"E-Commerce Landing Page",desc:"High-converting product landing page with animated sections, testimonials, and integrated payment flow.",category:"web",tags:["HTML","CSS","JavaScript"],image:"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=600&q=80",github:"https://github.com",demo:"#",date:"Jun 2024",featured:false},
      {id:8,title:"Motion Graphics Reel",desc:"Compilation of motion graphics and visual effects created for various YouTube channels and social media campaigns.",category:"video",tags:["After Effects","Cinema 4D","DaVinci"],image:"https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?w=600&q=80",github:"#",demo:"https://youtube.com",date:"May 2024",featured:false},
      {id:9,title:"Chatbot with GPT-4",desc:"Intelligent customer support chatbot powered by GPT-4 with context memory, multi-turn conversations, and admin dashboard.",category:"ai",tags:["Python","GPT-4","React"],image:"https://images.unsplash.com/photo-1531746790731-6c087fecd65a?w=600&q=80",github:"https://github.com",demo:"#",date:"Apr 2024",featured:false}
    ];

    function getProjects() {
      try { const s = localStorage.getItem('sj_projects'); return s ? JSON.parse(s) : DEFAULT_PROJECTS; }
      catch { return DEFAULT_PROJECTS; }
    }

    // ── STATE ──
    let allProjects = getProjects();
    let filtered = [...allProjects];
    let currentFilter = 'all';
    let currentSearch = '';
    let currentSort = 'newest';
    let currentPage = 1;
    const PER_PAGE = 9;

    // ── CURSOR ──
    const cursor = document.getElementById('cursor');
    const trail = document.getElementById('cursor-trail');
    let mx=0,my=0,tx=0,ty=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px'});
    (function animTrail(){tx+=(mx-tx)*.12;ty+=(my-ty)*.12;trail.style.left=tx+'px';trail.style.top=ty+'px';requestAnimationFrame(animTrail)})();

    // ── FILTER & SEARCH ──
    document.getElementById('searchInput').addEventListener('input', e => {
      currentSearch = e.target.value.toLowerCase();
      currentPage = 1;
      applyFilters();
    });

    document.getElementById('filterTabs').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-filter');
      currentPage = 1;
      applyFilters();
    });

    document.getElementById('sortSelect').addEventListener('change', e => {
      currentSort = e.target.value;
      currentPage = 1;
      applyFilters();
    });

    function applyFilters() {
      allProjects = getProjects();
      filtered = allProjects.filter(p => {
        const mf = currentFilter === 'all' || p.category === currentFilter;
        const ms = !currentSearch || p.title.toLowerCase().includes(currentSearch) || p.desc.toLowerCase().includes(currentSearch) || p.tags.some(t => t.toLowerCase().includes(currentSearch));
        return mf && ms;
      });

      // Sort
      if (currentSort === 'featured') filtered.sort((a,b) => (b.featured?1:0)-(a.featured?1:0));
      else if (currentSort === 'az') filtered.sort((a,b) => a.title.localeCompare(b.title));
      else if (currentSort === 'oldest') filtered.sort((a,b) => a.id - b.id);
      else filtered.sort((a,b) => b.id - a.id);

      renderGrid();
      renderPagination();
      document.getElementById('resultsCount').textContent = filtered.length;
    }

    function renderGrid() {
      const grid = document.getElementById('projectsGrid');
      const start = (currentPage - 1) * PER_PAGE;
      const page = filtered.slice(start, start + PER_PAGE);

      if (page.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No projects found</div><div class="empty-text">// Try adjusting your search or filter criteria</div></div>`;
        return;
      }

      grid.innerHTML = page.map(p => `
        <div class="project-card ${p.featured?'featured':''}" data-id="${p.id}">
          <div class="project-thumb">
            <img src="${p.image}" alt="${p.title}" loading="lazy"/>
            <div class="project-thumb-overlay"></div>
            ${p.featured?'<span class="project-featured-badge">⭐ Featured</span>':''}
          </div>
          <div class="project-body">
            <div class="project-tags">${p.tags.map(t=>`<span class="project-tag">${t}</span>`).join('')}</div>
            <h3 class="project-title">${p.title}</h3>
            <p class="project-desc">${p.desc}</p>
            <div class="project-footer">
              <span class="project-date">${p.date}</span>
              <div class="project-links">
                ${p.github!=='#'?`<a href="${p.github}" target="_blank" class="project-link github" onclick="event.stopPropagation()"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>GitHub</a>`:''}
                ${p.demo!=='#'?`<a href="${p.demo}" target="_blank" class="project-link demo" onclick="event.stopPropagation()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Live</a>`:''}
              </div>
            </div>
          </div>
        </div>
      `).join('');

      // Animate in
      grid.querySelectorAll('.project-card').forEach((card, i) => {
        setTimeout(() => card.classList.add('visible'), i * 60);
        card.addEventListener('click', e => {
          if (e.target.closest('.project-link')) return;
          openModal(parseInt(card.getAttribute('data-id')));
        });
      });
    }

    function renderPagination() {
      const total = Math.ceil(filtered.length / PER_PAGE);
      const pg = document.getElementById('pagination');
      if (total <= 1) { pg.innerHTML = ''; return; }

      let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
      for (let i = 1; i <= total; i++) {
        if (i === 1 || i === total || Math.abs(i - currentPage) <= 1) {
          html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
        } else if (Math.abs(i - currentPage) === 2) {
          html += `<span style="color:var(--text-muted);padding:0 4px">…</span>`;
        }
      }
      html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>`;
      pg.innerHTML = html;
    }

    function goPage(n) {
      const total = Math.ceil(filtered.length / PER_PAGE);
      if (n < 1 || n > total) return;
      currentPage = n;
      renderGrid();
      renderPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── MODAL ──
    function openModal(id) {
      const p = getProjects().find(x => x.id === id);
      if (!p) return;
      document.getElementById('modalContent').innerHTML = `
        <div style="margin-bottom:24px"><img src="${p.image}" alt="${p.title}" style="width:100%;border-radius:12px;aspect-ratio:16/9;object-fit:cover"/></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${p.tags.map(t=>`<span class="project-tag">${t}</span>`).join('')}${p.featured?'<span class="project-featured-badge" style="position:static">⭐ Featured</span>':''}</div>
        <h2 style="font-family:var(--font-display);font-size:1.6rem;font-weight:800;margin-bottom:12px;color:var(--text-primary)">${p.title}</h2>
        <p style="color:var(--text-secondary);line-height:1.8;margin-bottom:24px;font-size:.95rem">${p.desc}</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          ${p.github!=='#'?`<a href="${p.github}" target="_blank" class="btn btn-secondary"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>View on GitHub</a>`:''}
          ${p.demo!=='#'?`<a href="${p.demo}" target="_blank" class="btn btn-primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Live Demo</a>`:''}
        </div>
      `;
      document.getElementById('projectModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('projectModal').addEventListener('click', e => { if (e.target === document.getElementById('projectModal')) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    function closeModal() { document.getElementById('projectModal').classList.remove('active'); document.body.style.overflow = ''; }

    // ── INIT ──
    applyFilters();
  </script>
</body>
</html>
